# Application project 
sonar.projectKey=email-campaign 
sonar.projectName=email-campaign
 
# Source code locations 
sonar.sources=backend/src,frontend/src 
 
# Exclude generated files and dependencies 
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/** 
 
# Test configuration 
sonar.tests=backend/src,frontend/src 
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.js 