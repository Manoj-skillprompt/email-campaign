# Project Identification
sonar.projectKey=email-campaign-v2
sonar.projectName=Email Campaign V2
sonar.projectVersion=1.0.0

# Source & Test Code Structure
sonar.sources=frontend/src,backend/src,packages/contracts/src
sonar.tests=frontend/src,backend/src,packages/contracts/src,e2e

# File Inclusions and Exclusions for Tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,frontend/src/test/**/*
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/public/**,**/*.config.*,**/next-env.d.ts,pnpm-lock.yaml

# Encoding & Environment
sonar.sourceEncoding=UTF-8
sonar.nodejs.executable=node

# TypeScript & JavaScript Analysis
sonar.typescript.tsconfigPaths=tsconfig.json,frontend/tsconfig.json,backend/tsconfig.json,packages/contracts/tsconfig.json

# Test Execution and Coverage Reports (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info,frontend/coverage/lcov.info,backend/coverage/lcov.info,packages/contracts/coverage/lcov.info

# Quality Gate Configurations
# Duplicate Detection
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,frontend/src/test/**,features/**
